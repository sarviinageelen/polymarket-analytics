<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Explore Polymarket sports data, wallet performance, market odds, and refresh history." />
    <link rel="icon" href="data:," />
    <title>Polymarket Analytics</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("polymarket-analytics-theme") || "system"
          const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
          document.querySelector('meta[name="theme-color"]').content = dark ? "#171717" : "#ffffff"
        } catch {
          // Keep the light default when browser storage is unavailable.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
