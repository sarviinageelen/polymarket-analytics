[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-analytics"
version = "0.1.0"
description = "Reproducible Polymarket NFL 2025 bettor analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
data = [
    "duckdb>=1.5",
    "pyarrow>=14.0",
]
nav = [
    "duckdb>=1.5",
    "httpx>=0.27",
    "pyarrow>=14.0",
]
excel = [
    "openpyxl>=3.1",
    "XlsxWriter>=3.2",
]

[project.scripts]
polymarket-analytics = "polymarket_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
